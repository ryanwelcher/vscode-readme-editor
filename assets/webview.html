  <body>
    <div
      id="loading-overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      "
    >
      <div style="display: flex; flex-direction: column; align-items: center">
        <div
          class="spinner"
          style="
            border: 6px solid #f3f3f3;
            border-top: 6px solid #0078d4;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
          "
        ></div>
        <div style="margin-top: 16px; font-size: 1.1em; color: #333">
          Loading Playground...
        </div>
      </div>
    </div>
    <iframe
      id="pg"
      style="border: none"
      width="100%"
      height="1000px"
      src="{$playgroundURL}"
    ></iframe>
    <style>
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      const iframe = document.getElementById('pg');
      const overlay = document.getElementById('loading-overlay');
      iframe.addEventListener('load', () => {
        overlay.style.display = 'none';
      });
    </script>
  </body>
